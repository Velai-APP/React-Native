
workflows:
  ios-debug:
    name: iPhone Debug IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS Debug App
        script: |
          flutter build ios --debug --no-codesign

      - name: Create Debug IPA
        script: |
          mkdir -p /tmp/ios-debug/Payload
          cp -R build/ios/iphoneos/Runner.app \
            /tmp/ios-debug/Payload/

          cd /tmp/ios-debug
          zip -qry "$CM_BUILD_DIR/Runner-debug.ipa" Payload

    artifacts:
      - Runner-debug.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
