
workflows:
  ios-debug:
    name: iPhone Debug IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Build physical iPhone debug app
        script: |
          flutter build ios --debug --no-codesign

          test -d build/ios/iphoneos/Runner.app

      - name: Package unsigned Debug IPA
        script: |
          mkdir -p build/ios/ipa
          mkdir -p /tmp/iphone-debug/Payload

          cp -R build/ios/iphoneos/Runner.app \
            /tmp/iphone-debug/Payload/

          cd /tmp/iphone-debug

          zip -qry \
            "$CM_BUILD_DIR/build/ios/ipa/Runner-debug.ipa" \
            Payload

          ls -lh \
            "$CM_BUILD_DIR/build/ios/ipa/Runner-debug.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
